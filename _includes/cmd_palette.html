<div id="cmd-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Command Palette">
  <div class="cmd-palette-dialog">
    <div class="cmd-input-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-secondary);">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="cmd-input" class="cmd-input" placeholder="Type a command or press 1, 2, 3, L, D, M..." autocomplete="off" />
      <span class="shortcut-badge">ESC</span>
    </div>
    <div id="cmd-results" class="cmd-results-list"></div>
    <div class="cmd-palette-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> select</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
