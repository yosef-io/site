<header class="mobile-top-bar">
  <a href="{{ '/' | relative_url }}#home" class="sidebar-brand" style="margin-bottom: 0;">
    <div class="brand-logo-watermelon">
      {% include watermelon_icon.html %}
    </div>
    <div class="brand-info">
      <span class="brand-name">{{ site.title }}</span>
      <span class="brand-tagline">{{ site.tagline }}</span>
    </div>
  </a>
  <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
</header>
