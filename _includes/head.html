<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if page.title and page.layout != 'home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />
<meta name="author" content="{{ site.author.name }}" />

<!-- Favicon & Touch Icons -->
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
<link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon.png' | relative_url }}" />
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/watermelon.svg' | relative_url }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" />

<!-- Preconnect Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

<!-- Immediate theme application script to prevent FOUC -->
<script>
  (function() {
    var stored = localStorage.getItem('theme-mode') || 'dark';
    var effective = stored;
    if (stored === 'auto') {
      effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme-mode', stored);
    if (effective === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }

    // Immediate sidebar preferences application to prevent layout shift
    var savedWidth = localStorage.getItem('sidebar-width');
    if (savedWidth) {
      var parsedWidth = parseInt(savedWidth, 10);
      if (!isNaN(parsedWidth) && parsedWidth >= 180 && parsedWidth <= 600) {
        document.documentElement.style.setProperty('--sidebar-width', parsedWidth + 'px');
      }
    }
    if (localStorage.getItem('sidebar-hidden') === 'true' && window.innerWidth > 900) {
      document.documentElement.classList.add('sidebar-hidden');
    }

    // Immediate custom mixed palette application if saved
    try {
      var savedPalette = localStorage.getItem('mixed-color-palette');
      if (savedPalette) {
        var pal = JSON.parse(savedPalette);
        for (var prop in pal) {
          if (Object.prototype.hasOwnProperty.call(pal, prop)) {
            document.documentElement.style.setProperty(prop, pal[prop]);
          }
        }
      }
    } catch (_) {}
  })();
</script>
