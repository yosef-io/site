<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <!-- Floating Sidebar Reveal Button (Shown when desktop sidebar is hidden) -->
  <button id="sidebar-reveal-btn" class="sidebar-reveal-btn" title="Show sidebar (Press [ or Ctrl+B)" aria-label="Show sidebar">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="9" y1="3" x2="9" y2="21"></line>
      <polyline points="13 9 16 12 13 15"></polyline>
    </svg>
    <span class="reveal-hint">Sidebar</span>
    <span class="shortcut-badge">[</span>
  </button>

  <!-- Watermelon Quick Action Badge (Desktop Upper Right) -->
  <div class="upper-right-widget">
    <button id="watermelon-badge-btn" class="watermelon-badge" title="Watermelon · Yosef.io" aria-label="Watermelon badge">
      {% include watermelon_icon.html %}
    </button>
  </div>

  <!-- Mobile Top Bar -->
  {% include header.html %}

  <div class="app-container">
    <!-- Main Sticky Sidebar -->
    {% include sidebar.html %}

    <!-- Main Content Stage -->
    <main class="main-wrapper" id="main-content">
      <div class="content-container">
        {{ content }}
      </div>
    </main>
  </div>

  <!-- Command Palette Modal -->
  {% include cmd_palette.html %}

  <!-- Quick-Read Article Modal -->
  {% include article_modal.html %}

  <!-- Color Mixer Studio Modal -->
  {% include color_mixer_modal.html %}

  <!-- Toast Container -->
  {% include toast.html %}

  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
